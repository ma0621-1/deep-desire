<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>性格强度自评</title>
<style>
/* ===================== 全局基调：深夜密卷 ===================== */
:root{
  --bg:        #05060a;
  --gold:      #c9a227;
  --cyan:      #5fb3ae;
  --text:      #cfcdc4;
  --dim:       #7c7e78;
  --line:      rgba(201,166,86,0.16);
  --serif: "Songti SC","STSong","SimSun","Noto Serif SC","Source Han Serif SC",serif;
  --mono: ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  min-height:100vh;
  background:
    radial-gradient(1200px 720px at 50% -12%, rgba(58,92,92,0.17), transparent 62%),
    radial-gradient(900px 620px at 92% 112%, rgba(122,92,20,0.11), transparent 62%),
    radial-gradient(700px 500px at 4% 40%, rgba(40,80,120,0.06), transparent 65%),
    var(--bg);
  color:var(--text);
  font-family:var(--serif);
  letter-spacing:.02em;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(circle at 50% 24%, #000 0%, transparent 78%);
  mask-image:radial-gradient(circle at 50% 24%, #000 0%, transparent 78%);
}
.wrap{ position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:56px 22px 96px; }
header{ text-align:center; margin-bottom:40px; }
h1{
  margin:0;
  font-size:clamp(25px, 4.2vw, 38px);
  font-weight:600;
  letter-spacing:.42em; text-indent:.42em;
  background:linear-gradient(180deg,#f4e7b6 0%, #c9a227 52%, #7c6418 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 16px rgba(201,166,86,0.28));
}
.sub{
  margin:15px 0 0; font-size:12.5px;
  letter-spacing:.5em; text-indent:.5em;
  color:rgba(120,180,178,0.62);
}
.rule{
  width:min(520px, 78%); height:1px; margin:24px auto 0;
  background:linear-gradient(90deg, transparent, rgba(201,166,86,0.55), rgba(95,179,174,0.35), transparent);
  box-shadow:0 0 12px rgba(201,166,86,0.25);
}
/* ===================== 问卷 ===================== */
.q-meta{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:12px; letter-spacing:.22em; color:rgba(255,255,255,0.34);
  margin-bottom:12px; font-family:var(--mono);
}
.q-progress{
  height:2px; border-radius:2px; background:rgba(255,255,255,0.07);
  overflow:hidden; margin-bottom:34px;
}
.q-progress i{
  display:block; height:100%; width:0; border-radius:2px;
  background:linear-gradient(90deg, rgba(95,179,174,0.85), rgba(201,166,86,0.95));
  box-shadow:0 0 12px rgba(201,166,86,0.5);
  transition:width .45s cubic-bezier(.2,.85,.25,1);
}
.q-card{
  position:relative;
  border:1px solid var(--line); border-radius:2px;
  padding:38px 34px 34px;
  background:linear-gradient(180deg, rgba(255,255,255,0.028), rgba(255,255,255,0.006));
  box-shadow: inset 0 0 80px rgba(0,0,0,0.68), 0 0 46px rgba(0,0,0,0.6);
  min-height:330px;
}
.q-card::before,.q-card::after{
  content:""; position:absolute; width:14px; height:14px;
  border:1px solid rgba(201,166,86,0.45); pointer-events:none;
}
.q-card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.q-card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
.q-num{
  margin:0 0 18px; font-size:12px;
  letter-spacing:.5em; text-indent:.5em;
  color:rgba(201,166,86,0.6);
}
.q-text{
  margin:0 0 30px;
  font-size:clamp(16px, 2.1vw, 19px);
  line-height:1.95; letter-spacing:.06em; color:#e6e2d6;
  text-shadow:0 0 18px rgba(200,220,220,0.10);
  animation:riseIn .4s ease both;
}
.q-options{ display:flex; flex-direction:column; gap:11px; }
.opt{
  display:flex; align-items:center; gap:15px;
  width:100%; text-align:left;
  padding:14px 20px;
  border:1px solid rgba(255,255,255,0.075); border-radius:2px;
  background:rgba(255,255,255,0.012);
  color:#c5c2b7; font-family:var(--serif);
  font-size:14.5px; letter-spacing:.1em;
  cursor:pointer; transition:all .22s ease;
  animation:riseIn .38s ease both;
}
.opt:hover{
  border-color:rgba(201,166,86,0.42);
  background:rgba(201,166,86,0.045);
  color:#efe7c8;
  box-shadow:0 0 18px rgba(201,166,86,0.10), inset 0 0 22px rgba(201,166,86,0.045);
}
.opt.selected{
  border-color:rgba(201,166,86,0.82);
  background:linear-gradient(90deg, rgba(201,166,86,0.16), rgba(201,166,86,0.03));
  color:#f7ecc2;
  box-shadow:0 0 22px rgba(201,166,86,0.20), inset 0 0 26px rgba(201,166,86,0.07);
}
.opt-mark{
  flex:none; width:10px; height:10px; border-radius:50%;
  border:1px solid rgba(255,255,255,0.28); transition:all .22s ease;
}
.opt:hover .opt-mark{ border-color:rgba(201,166,86,0.8); }
.opt.selected .opt-mark{
  border-color:#f2d97e;
  background:radial-gradient(circle at 34% 32%, #fff6d0, #c9a227 65%);
  box-shadow:0 0 10px rgba(201,166,86,0.9), 0 0 20px rgba(201,166,86,0.45);
}
.opt-key{
  flex:none; margin-left:auto;
  font-family:var(--mono); font-size:10.5px;
  letter-spacing:0; color:rgba(255,255,255,0.20);
}
.opt.selected .opt-key{ color:rgba(201,166,86,0.7); }
@keyframes riseIn{
  from{ opacity:0; transform:translateY(8px); }
  to  { opacity:1; transform:none; }
}
/* ===================== 按钮 ===================== */
.actions{
  display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:34px;
}
.btn{
  font-family:var(--serif); font-size:13.5px;
  letter-spacing:.3em; text-indent:.3em;
  padding:12px 30px; border-radius:2px;
  background:transparent; border:1px solid rgba(201,166,86,0.32);
  color:#d6c88e; cursor:pointer; transition:all .28s ease;
}
.btn:hover:not(:disabled){
  border-color:rgba(201,166,86,0.85); color:#f6e8b8;
  box-shadow:0 0 20px rgba(201,166,86,0.22), inset 0 0 20px rgba(201,166,86,0.08);
  text-shadow:0 0 12px rgba(201,166,86,0.55);
}
.btn:active:not(:disabled){ transform:translateY(1px); }
.btn:disabled{
  opacity:.3; cursor:not-allowed;
  border-color:rgba(255,255,255,0.12); color:rgba(255,255,255,0.3);
}
.hint{
  text-align:center; min-height:18px; margin:18px 0 0;
  font-size:12.5px; letter-spacing:.18em;
  color:rgba(201,166,86,0.72);
  opacity:0; transition:opacity .3s ease;
}
.hint.show{ opacity:1; }
.done-banner{
  text-align:center;
  margin:0 0 34px;
  padding:16px 20px;
  border:1px solid rgba(201,166,86,0.28);
  border-radius:2px;
  background:linear-gradient(180deg, rgba(201,166,86,0.06), rgba(201,166,86,0.01));
  font-size:13.5px;
  letter-spacing:.22em;
  color:rgba(232,205,130,0.92);
  text-shadow:0 0 14px rgba(201,166,86,0.35);
  opacity:0;
  transform:translateY(-6px);
  transition:opacity .5s ease, transform .5s ease;
  pointer-events:none;
}
.done-banner.show{ opacity:1; transform:none; }
/* ===================== 付费墙 ===================== */
.paywall{
  margin-top:52px; opacity:0; transform:translateY(14px);
  transition:opacity .6s ease, transform .6s ease;
}
.paywall.hidden{ display:none; }
.paywall.show{ opacity:1; transform:none; }
.pw-card{
  position:relative;
  max-width:520px; margin:0 auto;
  text-align:center;
  padding:46px 40px 44px;
  border:1px solid rgba(201,166,86,0.30);
  border-radius:3px;
  background:
    radial-gradient(480px 260px at 50% -10%, rgba(201,166,86,0.10), transparent 65%),
    linear-gradient(180deg, rgba(255,255,255,0.022), rgba(255,255,255,0.005));
  box-shadow: inset 0 0 70px rgba(0,0,0,0.62), 0 0 44px rgba(0,0,0,0.55);
}
.pw-card::before,.pw-card::after{
  content:""; position:absolute; width:16px; height:16px;
  border:1px solid rgba(201,166,86,0.5); pointer-events:none;
}
.pw-card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
.pw-card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
.pw-title{
  margin:0 0 12px;
  font-size:16px; font-weight:600;
  letter-spacing:.5em; text-indent:.5em;
  color:#e9d9a4; text-shadow:0 0 16px rgba(201,166,86,0.4);
}
.pw-sub{
  margin:0 0 26px;
  font-size:12.5px; letter-spacing:.3em; text-indent:.3em;
  color:rgba(255,255,255,0.42);
}
.pw-price{
  font-family:var(--mono);
  font-size:46px; font-weight:700; line-height:1;
  color:#f5e6ae;
  letter-spacing:-.02em;
  text-shadow:0 0 34px rgba(201,166,86,0.8), 0 0 70px rgba(201,166,86,0.3);
  margin-bottom:8px;
}
.pw-price small{ font-size:.42em; font-weight:500; margin-left:4px; color:rgba(245,230,174,0.7); }
.pw-desc{
  margin:0 0 30px;
  font-size:13px; line-height:2.1; letter-spacing:.1em;
  color:#b7b4ab;
}
.pw-desc i{ font-style:normal; color:#e6cf85; padding:0 2px; }
.pw-status{
  min-height:18px; margin:16px 0 0;
  font-size:12.5px; letter-spacing:.16em;
  color:rgba(201,166,86,0.8);
}
/* ===================== 结果区 ===================== */
.result{
  margin-top:62px; opacity:0; transform:translateY(14px);
  transition:opacity .7s ease, transform .7s ease;
}
.result.hidden{ display:none; }
.result.show{ opacity:1; transform:none; }
.result h2{
  text-align:center; font-size:15px; font-weight:500;
  letter-spacing:.55em; text-indent:.55em;
  color:rgba(201,166,86,0.78); margin:0 0 34px;
  text-shadow:0 0 16px rgba(201,166,86,0.3);
}
/* =========================================================
   ★ 主导三性 展示区（雷达图正上方）
   ========================================================= */
.top-traits{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:18px;
  max-width:860px;
  margin:0 auto 44px;
}
.tt-item{
  position:relative;
  text-align:center;
  padding:22px 16px 24px;
  border:1px solid rgba(201,166,86,0.22);
  border-radius:3px;
  background:linear-gradient(180deg, rgba(201,166,86,0.045), rgba(201,166,86,0.005));
  box-shadow:
    0 0 24px rgba(201,166,86,0.05),
    inset 0 0 34px rgba(0,0,0,0.45);
  animation:ttIn .6s cubic-bezier(.2,.85,.25,1) both;
}
.tt-item:nth-child(1){ animation-delay:0s;   }
.tt-item:nth-child(2){ animation-delay:.09s; }
.tt-item:nth-child(3){ animation-delay:.18s; }
@keyframes ttIn{
  from{ opacity:0; transform:translateY(-10px); }
  to  { opacity:1; transform:none; }
}
/* 第一名：整体视觉重量明显更重 */
.tt-item.tt-1{
  border-color:rgba(242,217,126,0.72);
  background:linear-gradient(180deg, rgba(201,166,86,0.18), rgba(201,166,86,0.03));
  box-shadow:
    0 0 46px rgba(201,166,86,0.28),
    0 0 90px rgba(201,166,86,0.10),
    inset 0 0 44px rgba(201,166,86,0.08);
}
.tt-item.tt-2{ border-color:rgba(201,166,86,0.40); }
.tt-item.tt-3{ border-color:rgba(201,166,86,0.28); }
/* 位次标签 */
.tt-rank{
  display:block;
  font-size:10.5px;
  font-family:var(--mono);
  letter-spacing:.4em; text-indent:.4em;
  color:rgba(255,255,255,0.34);
  margin-bottom:12px;
}
.tt-item.tt-1 .tt-rank{ color:rgba(242,217,126,0.95); text-shadow:0 0 14px rgba(201,166,86,0.7); }
.tt-item.tt-2 .tt-rank{ color:rgba(214,189,118,0.75); }
.tt-item.tt-3 .tt-rank{ color:rgba(182,161,104,0.68); }
/* 性格名 */
.tt-name{
  display:block;
  font-size:clamp(19px, 2.8vw, 26px);
  font-weight:600;
  letter-spacing:.28em; text-indent:.28em;
  color:#e2ded0;
  margin-bottom:16px;
}
.tt-item.tt-1 .tt-name{
  color:#f9f0c8;
  text-shadow:0 0 26px rgba(201,166,86,0.85), 0 0 50px rgba(201,166,86,0.35);
}
.tt-item.tt-2 .tt-name{ color:#e8d9a4; text-shadow:0 0 16px rgba(201,166,86,0.35); }
.tt-item.tt-3 .tt-name{ color:#d4c48e; }
/* 分数 */
.tt-score{
  display:block;
  font-family:var(--mono);
  font-size:clamp(26px, 4.2vw, 40px);
  font-weight:700;
  line-height:1;
  color:#d9c37a;
  font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
}
.tt-item.tt-1 .tt-score{
  color:#f9ecb8;
  text-shadow:0 0 30px rgba(201,166,86,0.85), 0 0 60px rgba(201,166,86,0.35);
}
.tt-item.tt-2 .tt-score{ color:#e3d094; text-shadow:0 0 16px rgba(201,166,86,0.4); }
.tt-item.tt-3 .tt-score{ color:#cbba86; }
.tt-score small{
  font-size:.44em;
  margin-left:3px;
  font-weight:500;
  color:rgba(217,195,122,0.6);
}
.tt-item.tt-1 .tt-score small{ color:rgba(249,236,184,0.7); }
/* ===================== 雷达图 ===================== */
.chart-box{ width:100%; display:flex; justify-content:center; }
canvas#radar{
  display:block; margin:0 auto;
  filter:drop-shadow(0 0 40px rgba(110,180,180,0.12));
}
/* ===================== 排名表 ===================== */
.rank-table{
  margin:52px auto 0; max-width:780px;
  border:1px solid rgba(255,255,255,0.075); border-radius:2px;
  background:linear-gradient(180deg, rgba(255,255,255,0.018), rgba(255,255,255,0.004));
  box-shadow:inset 0 0 60px rgba(0,0,0,0.6);
  overflow:hidden;
}
.rank-head,.rank-row{
  display:grid;
  grid-template-columns:56px 130px minmax(0,1fr) 70px;
  gap:16px; align-items:center; padding:12px 22px;
}
.rank-head{
  font-size:11.5px; letter-spacing:.22em;
  color:rgba(255,255,255,0.30);
  border-bottom:1px solid rgba(255,255,255,0.075);
  background:rgba(255,255,255,0.014);
}
.rank-row{
  border-bottom:1px solid rgba(255,255,255,0.04); font-size:14px;
}
.rank-row:last-child{ border-bottom:none; }
.rank-row.top1{ background:linear-gradient(90deg, rgba(201,166,86,0.15), rgba(201,166,86,0) 72%); }
.rank-row.top2{ background:linear-gradient(90deg, rgba(201,166,86,0.09), rgba(201,166,86,0) 72%); }
.rank-row.top3{ background:linear-gradient(90deg, rgba(201,166,86,0.055), rgba(201,166,86,0) 72%); }
.rank-no{
  font-family:var(--mono); font-size:13px; color:rgba(255,255,255,0.32);
}
.rank-row.top1 .rank-no{ color:#f2d97e; text-shadow:0 0 12px rgba(201,166,86,0.8); }
.rank-row.top2 .rank-no{ color:#d6bd76; }
.rank-row.top3 .rank-no{ color:#b6a168; }
.rank-name{ letter-spacing:.16em; color:#dcd8cb; }
.rank-row.top1 .rank-name{ color:#f7ecc2; text-shadow:0 0 16px rgba(201,166,86,0.5); }
.rank-bar{
  position:relative; height:4px; border-radius:2px;
  background:rgba(255,255,255,0.07); overflow:hidden;
}
.rank-bar i{
  display:block; height:100%; width:0; border-radius:2px;
  background:linear-gradient(90deg, rgba(95,179,174,0.72), rgba(201,166,86,0.95));
  box-shadow:0 0 12px rgba(201,166,86,0.5);
  transition:width 1s cubic-bezier(.2,.85,.25,1);
}
.rank-score{
  text-align:right; font-family:var(--mono);
  font-size:13.5px; color:#cec5a0; font-variant-numeric:tabular-nums;
}
.rank-row.top1 .rank-score{ color:#f4e4b0; text-shadow:0 0 12px rgba(201,166,86,0.5); }
/* ===================== 性情解读 ===================== */
.analysis{
  position:relative;
  max-width:780px;
  margin:64px auto 0;
  padding-top:46px;
  border-top:1px solid rgba(201,166,86,0.14);
}
.analysis::before{
  content:"◆";
  position:absolute;
  top:-7px; left:50%;
  transform:translateX(-50%);
  background:var(--bg);
  padding:0 16px;
  color:rgba(201,166,86,0.55);
  font-size:9px;
  letter-spacing:0;
}
.ana-title{
  text-align:center;
  font-size:14px; font-weight:500;
  letter-spacing:.55em; text-indent:.55em;
  color:rgba(201,166,86,0.78);
  margin:0 0 38px;
  text-shadow:0 0 16px rgba(201,166,86,0.3);
}
.ana-block{ margin-bottom:36px; }
.ana-block:last-child{ margin-bottom:0; }
.ana-block h3{
  margin:0 0 16px;
  font-size:11.5px; font-weight:600;
  letter-spacing:.42em; text-indent:.42em;
  color:rgba(95,179,174,0.78);
  display:flex; align-items:center; gap:14px;
}
.ana-block h3::after{
  content:"";
  flex:1; height:1px;
  background:linear-gradient(90deg, rgba(95,179,174,0.22), transparent);
}
.ana-block p{
  margin:0;
  font-size:14px; line-height:2.05;
  letter-spacing:.04em; color:#b7b4ab;
}
.ana-block p em{
  font-style:normal; color:#e6cf85;
  padding:0 2px;
  text-shadow:0 0 12px rgba(201,166,86,0.35);
}
.ana-item{
  padding:16px 20px;
  margin-bottom:12px;
  border-left:2px solid rgba(201,166,86,0.32);
  background:linear-gradient(90deg, rgba(201,166,86,0.045), rgba(201,166,86,0));
}
.ana-item:last-child{ margin-bottom:0; }
.ana-item h4{
  margin:0 0 9px;
  font-size:13px; font-weight:600;
  letter-spacing:.16em; color:#e0d3a0;
}
.ana-item p{
  font-size:13.5px; line-height:2; color:#b3b0a7;
}
.ana-closing{
  margin-top:48px; padding-top:32px;
  border-top:1px solid rgba(255,255,255,0.055);
  text-align:center;
}
.ana-closing p{
  font-size:14px; letter-spacing:.12em;
  color:rgba(201,166,86,0.80);
  line-height:2.1;
  text-shadow:0 0 14px rgba(201,166,86,0.22);
}
.foot{
  margin-top:48px; text-align:center;
  font-size:11.5px; letter-spacing:.3em;
  color:rgba(255,255,255,0.16);
}
/* ===================== 响应式 ===================== */
@media (max-width:720px){
  .wrap{ padding:40px 15px 72px; }
  .q-card{ padding:28px 20px 26px; min-height:290px; }
  .opt{ padding:12px 15px; font-size:13.5px; gap:12px; }
  .opt-key{ display:none; }
  .actions{ gap:12px; margin-top:26px; }
  .btn{ padding:11px 20px; font-size:12.5px; letter-spacing:.2em; text-indent:.2em; }
  /* 主导三性：小屏仍保持三列，但压缩留白 */
  .top-traits{ gap:8px; margin-bottom:30px; }
  .tt-item{ padding:14px 6px 16px; }
  .tt-rank{ font-size:9px; letter-spacing:.22em; text-indent:.22em; margin-bottom:8px; }
  .tt-name{ font-size:15px; letter-spacing:.14em; text-indent:.14em; margin-bottom:10px; }
  .tt-score{ font-size:24px; }
  .tt-score small{ font-size:.42em; margin-left:2px; }
  .rank-head,.rank-row{
    grid-template-columns:36px 92px minmax(0,1fr) 54px;
    gap:10px; padding:11px 14px; font-size:13px;
  }
  .rank-head{ font-size:10.5px; letter-spacing:.12em; }
  .rank-name{ letter-spacing:.06em; }
  .analysis{ margin-top:48px; padding-top:36px; }
  .ana-item{ padding:14px 15px; }
  .ana-block p{ font-size:13.5px; }
  /* 付费墙：小屏压缩 */
  .pw-card{ padding:34px 22px 32px; }
  .pw-title{ font-size:14px; letter-spacing:.3em; text-indent:.3em; }
  .pw-price{ font-size:38px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>性格强度自评</h1>

  if (n === 10) return '十';
  if (n < 20)  return '十' + d[n - 10];
  const tens = Math.floor(n / 10), ones = n % 10;
  return d[tens] + '十' + (ones ? d[ones] : '');
}

    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => {
      showResult();
      setTimeout(() => doneBanner.classList.remove('show'), 600);
    }, 720);
    return;
  }
  /* 未答完：自动跳下一题 */
  clearTimeout(autoTimer);
  if (current < QUESTIONS.length - 1) {
    autoTimer = setTimeout(() => { current++; renderQuestion(); }, 240);
  }
}
/* 数字键 1~5 快速作答，左右方向键翻页 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  const n = Number(e.key);
  if (n >= 1 && n <= 5) {
    selectOption(n - 1);
  } else if (e.key === 'ArrowLeft') {
    clearTimeout(autoTimer);
    if (current > 0) { current--; renderQuestion(); }
  } else if (e.key === 'ArrowRight') {
    clearTimeout(autoTimer);
    if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
  }
});
prevBtn.addEventListener('click', () => {
  clearTimeout(autoTimer);
  if (current > 0) { current--; renderQuestion(); }
});
nextBtn.addEventListener('click', () => {
  clearTimeout(autoTimer);
  if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
});
/* =========================================================
   九、重置全部
   ========================================================= */
resetBtn.addEventListener('click', () => {
  clearTimeout(autoTimer);
  clearInterval(pollTimer);
  answers.fill(null);
  current = 0;
  progress = 0;
  resultShown = false;
  resultEl.classList.remove('show');
  resultEl.classList.add('hidden');
  topTraitsEl.innerHTML = '';
  rankTableEl.innerHTML = '';
  analysisEl.innerHTML = '';
  doneBanner.classList.remove('show');
  hintEl.classList.remove('show');
  hintEl.textContent = '';
  paywallEl.classList.add('hidden');
  paywallEl.classList.remove('show');
  payStatusEl.textContent = '';
  clearLocalState();
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
/* =========================================================
   十、计分
   每种性格 8 题，每题最高 4 分 → 满分 32 → 折算百分比
   反向题：得分 = 4 - 所选分值
   ========================================================= */
function computeScores(){
  const totals = new Array(TRAITS.length).fill(0);
  const counts = new Array(TRAITS.length).fill(0);
  QUESTIONS.forEach((q, i) => {
    counts[q.trait]++;
    if (answers[i] !== null) {
      let s = SCALE[answers[i]].score;
      if (q.reverse) s = 4 - s;
      totals[q.trait] += s;
    }
  });
  return totals.map((sum, i) => {
    const full = counts[i] * 4;
    return full > 0 ? Math.round(sum / full * 100) : 0;
  });
}
/* =========================================================
   十一、雷达图
   ---------------------------------------------------------
   ★ 尺寸较上一版明显放大：最大接近容器满宽（820px）
   ★ 前三名顶点用金色圆点高亮，与其余顶点区分
   ========================================================= */
const canvas = document.getElementById('radar');
const ctx = canvas.getContext('2d');
let cssSize = 800;
let progress = 0;
let rafId = null;
/* 计算前三名的索引集合（供雷达图高亮用） */
function getTop3Set(){
  const idx = TRAITS.map((_, i) => i)
    .sort((a, b) => scores[b] - scores[a]);
  return new Set(idx.slice(0, 3));
}
function layoutCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const parent = canvas.parentElement;
  const avail = (parent && parent.clientWidth) ? parent.clientWidth : 800;
  /* ★ 放大：上限从 620 提到 820 */
  cssSize = Math.max(280, Math.min(avail, 820));
  canvas.style.width  = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  canvas.width  = Math.round(cssSize * dpr);
  canvas.height = Math.round(cssSize * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawRadar(prog){
  const size = cssSize;
  const n = TRAITS.length;
  const cx = size / 2, cy = size / 2;
  /* ★ 半径按画布比例缩放，留出标签空间（约为画布宽的 15%） */
  const pad = size * 0.15;
  const R = Math.max(70, size / 2 - pad);
  const startA = -Math.PI / 2;
  const ang = i => startA + i * 2 * Math.PI / n;
  const top3Set = getTop3Set();
  ctx.clearRect(0, 0, size, size);
  /* 幽暗底色 */
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, size * 0.56);
  bg.addColorStop(0,    'rgba(40,62,64,0.42)');
  bg.addColorStop(0.55, 'rgba(14,20,24,0.22)');
  bg.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, size, size);
  /* 最外圈微光弧 */
  ctx.beginPath();
  ctx.arc(cx, cy, R + size * 0.02, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.055)';
  ctx.lineWidth = 1;
  ctx.stroke();
  /* 同心十边形网格 */
  const rings = 4;
  for (let r = 1; r <= rings; r++){
    const rr = R * r / rings;
    ctx.beginPath();
    for (let i = 0; i < n; i++){
      const a = ang(i);
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = (r === rings) ? 'rgba(255,255,255,0.26)' : 'rgba(255,255,255,0.085)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  /* 放射轴线 */
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    const a = ang(i);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.09)';
  ctx.lineWidth = 1;
  ctx.stroke();
  /* 数据多边形顶点 */
  const pts = [];
  for (let i = 0; i < n; i++){
    const v = (scores[i] / 100) * prog;
    const a = ang(i);
    pts.push([ cx + Math.cos(a) * R * v, cy + Math.sin(a) * R * v ]);
  }
  /* 多边形内部填充 */
  ctx.beginPath();
  pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.closePath();
  const fill = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  fill.addColorStop(0,   'rgba(120,200,200,0.16)');
  fill.addColorStop(0.7, 'rgba(150,190,180,0.07)');
  fill.addColorStop(1,   'rgba(201,166,86,0.05)');
  ctx.fillStyle = fill;
  ctx.fill();
  /* 多边形白色描边（冷光） */
  ctx.save();
  ctx.beginPath();
  pts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.closePath();
  ctx.shadowColor = 'rgba(190,230,235,0.65)';
  ctx.shadowBlur = 16;
  ctx.strokeStyle = 'rgba(247,250,252,0.95)';
  ctx.lineWidth = 1.8;
  ctx.lineJoin = 'round';
  ctx.stroke();
  ctx.restore();
  /* ★ 顶点：前三名金色放大点，其余白色点 */
  pts.forEach(([x, y], i) => {
    const isTop = top3Set.has(i);
    ctx.save();
    if (isTop) {
      /* 外圈光晕 */
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(201,166,86,0.20)';
      ctx.fill();
      ctx.shadowColor = 'rgba(242,217,126,0.98)';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(x, y, 5.4, 0, Math.PI * 2);
      ctx.fillStyle = '#f9ecb8';
      ctx.fill();
    } else {
      ctx.shadowColor = 'rgba(210,240,255,0.95)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x, y, 3.6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
    ctx.restore();
  });
  /* 外围标签：前三名更亮、更粗 */
  const fs = Math.max(12, size * 0.023);
  ctx.font = `600 ${fs}px "Songti SC","STSong","Noto Serif SC",serif`;
  for (let i = 0; i < n; i++){
    const a = ang(i);
    const lx = cx + Math.cos(a) * (R + size * 0.035);
    const ly = cy + Math.sin(a) * (R + size * 0.035);
    const cosA = Math.cos(a), sinA = Math.sin(a);
    ctx.textAlign    = Math.abs(cosA) < 0.2 ? 'center' : (cosA > 0 ? 'left' : 'right');
    ctx.textBaseline = Math.abs(sinA) < 0.2 ? 'middle' : (sinA > 0 ? 'top' : 'bottom');
    const v = scores[i];
    const isTop = top3Set.has(i);
    if (isTop) {
      ctx.font = `700 ${fs * 1.08}px "Songti SC","STSong","Noto Serif SC",serif`;
      ctx.fillStyle = 'rgba(249,236,184,0.98)';
      ctx.shadowColor = 'rgba(201,166,86,0.85)';
      ctx.shadowBlur = 16;
    } else {
      ctx.font = `600 ${fs}px "Songti SC","STSong","Noto Serif SC",serif`;
      const alpha = 0.42 + (v / 100) * 0.5;
      ctx.fillStyle = v >= 60
        ? `rgba(232,205,130,${alpha})`
        : `rgba(214,216,210,${alpha})`;
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur = 6;
    }
    ctx.fillText(`${TRAITS[i].id} ${TRAITS[i].name}`, lx, ly);
    ctx.shadowBlur = 0;
  }
}
function animateRadar(){
  layoutCanvas();
  const t0 = performance.now();
  const dur = 1000;
  if (rafId) cancelAnimationFrame(rafId);
  (function frame(now){
    const p = Math.min(1, (now - t0) / dur);
    progress = 1 - Math.pow(1 - p, 3);
    drawRadar(progress);
    if (p < 1) { rafId = requestAnimationFrame(frame); }
    else { progress = 1; drawRadar(1); }
  })(performance.now());
}
window.addEventListener('resize', () => {
  if (resultEl.classList.contains('hidden')) return;
  layoutCanvas();
  drawRadar(progress);
});
/* =========================================================
   十二、★ 主导三性展示区（雷达图上方）
   ========================================================= */
function renderTopTraits(){
  /* 按分数从高到低取前三 */
  const top3 = TRAITS
    .map((t, i) => ({ ...t, v: scores[i] }))
    .sort((a, b) => b.v - a.v)
    .slice(0, 3);
  /* 位次文字 */
  const rankLabels = ['其 一', '其 二', '其 三'];
  let html = '';
  top3.forEach((t, idx) => {
    html += `
      <div class="tt-item tt-${idx + 1}">
        <span class="tt-rank">${rankLabels[idx]}</span>
        <span class="tt-name">${t.name}</span>
        <span class="tt-score">${t.v}<small>%</small></span>
      </div>`;
  });
  topTraitsEl.innerHTML = html;
}
/* =========================================================
   十三、排名表
   ========================================================= */
function renderTable(){
  const rows = TRAITS
    .map((t, i) => ({ ...t, v: scores[i] }))
    .sort((a, b) => b.v - a.v);
  let html = `
    <div class="rank-head">
      <span>位次</span><span>性格</span><span>强度分布</span><span>得分</span>
    </div>`;
  rows.forEach((r, idx) => {
    const cls = idx < 3 ? ` top${idx + 1}` : '';
    html += `
      <div class="rank-row${cls}">
        <span class="rank-no">${String(idx + 1).padStart(2, '0')}</span>
        <span class="rank-name">${r.id}·${r.name}</span>
        <span class="rank-bar"><i data-v="${r.v}"></i></span>
        <span class="rank-score">${r.v}%</span>
      </div>`;
  });
  rankTableEl.innerHTML = html;
  const bars = rankTableEl.querySelectorAll('.rank-bar i');
  requestAnimationFrame(() => {
    bars.forEach(b => { b.style.width = b.dataset.v + '%'; });
  });
}
/* =========================================================
   十四、性情解读
   ========================================================= */
function renderAnalysis(){
  const sortedIdx = TRAITS
    .map((_, i) => i)
    .sort((a, b) => scores[b] - scores[a]);
  const maxV   = scores[sortedIdx[0]];
  const minV   = scores[sortedIdx[sortedIdx.length - 1]];
  const spread = maxV - minV;
  const top3 = sortedIdx.slice(0, 3);
  const bot2 = sortedIdx.slice(-2);
  let toneText;
  if (spread >= 55) {
    toneText = '你的性格轮廓分明，长板与短板之间落差较大，行事风格会明显偏向主导项，遇到与主导项相悖的局面时也容易感到别扭。';
  } else if (spread >= 30) {
    toneText = '你的性格有主有次，主导项清晰，其余各项不弱，整体偏向稳健，多数场合都能应对自如。';
  } else {
    toneText = '十项分布相当均衡，没有哪一项压倒性地突出。这是一种少见的中正之姿——好处是适应面广，代价是缺少一锤定音的锋利。';
  }
  const top3Names = top3.map(i => TRAITS[i].name);
  let html = '';
  html += `<p class="ana-title">性 情 解 读</p>`;
  html += `
    <div class="ana-block">
      <h3>总 览</h3>
      <p>此番观照，以 <em>${top3Names.join('、')}</em> 三者最盛。${toneText}</p>
    </div>`;
  html += `<div class="ana-block"><h3>主 导 三 性</h3>`;
  top3.forEach(i => {
    const v = scores[i];
    const level = v >= 70 ? 'high' : v >= 40 ? 'mid' : 'low';
    html += `
      <div class="ana-item">
        <h4>${TRAITS[i].id} · ${TRAITS[i].name} · ${v}%</h4>
        <p>${TRAIT_READING[i][level]}</p>
      </div>`;
  });
  html += `</div>`;
  const bot2Names = bot2.map(i => TRAITS[i].name);
  html += `
    <div class="ana-block">
      <h3>薄 弱 之 处</h3>
      <p>与之相对，<em>${bot2Names.join('、')}</em> 两项偏弱。它们或是你尚未展开的侧面，或是你有意收敛的部分。少了它们，你的性格未必失衡，但在某些特定的局面里，可能会感到力有不逮。</p>
    </div>`;
  let closing;
  if (maxV >= 82) {
    closing = '此性既为你的锋芒，亦是你需时时回望之处。<br>越是突出的性格，越容易在顺境里积功，也越容易在逆境里反噬。';
  } else if (maxV >= 65) {
    closing = '主导性格清晰，行事有你自己的一贯方式。<br>认得清自己，比改变自己更重要。';
  } else {
    closing = '十性相济，不偏不倚。<br>这是一种难得的定力，也是一种需要主动作为才不会流于平庸的姿态。';
  }
  html += `
    <div class="ana-block ana-closing">
      <p>${closing}</p>
    </div>`;
  analysisEl.innerHTML = html;
}
/* =========================================================
   十五、展示 / 刷新结果
   ========================================================= */
function showResult(){
  scores = computeScores();
  resultEl.classList.remove('hidden');
  requestAnimationFrame(() => {
    resultEl.classList.add('show');
    renderTopTraits();   /* ★ 主导三性 */
    renderTable();
    renderAnalysis();
    animateRadar();
  });
  resultShown = true;
  setTimeout(() => {
    resultEl.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 120);
}
/* 回看修改后刷新已有结果 */
function refreshResult(){
  scores = computeScores();
  renderTopTraits();
  renderTable();
  renderAnalysis();
  animateRadar();
}
/* =========================================================
   十五·五、★ 付费墙与解锁
   ========================================================= */
const paywallEl   = document.getElementById('paywall');
const payBtn      = document.getElementById('payBtn');
const payStatusEl = document.getElementById('payStatus');
const LS_ANSWERS  = 'xgtz_answers_v1';
const LS_UNLOCKED = 'xgtz_unlocked_v1';

function loadSavedAnswers(){
  try {
    const a = JSON.parse(localStorage.getItem(LS_ANSWERS) || 'null');
    if (Array.isArray(a) && a.length === answers.length) {
      for (let i = 0; i < a.length; i++) {
        if (typeof a[i] === 'number' && a[i] >= 0 && a[i] <= 4) answers[i] = a[i];
      }
    }
  } catch (e) { /* 忽略损坏的本地数据 */ }
}
function saveAnswers(){
  try { localStorage.setItem(LS_ANSWERS, JSON.stringify(answers)); } catch (e) {}
}
function isUnlocked(){
  try { return localStorage.getItem(LS_UNLOCKED) === '1'; } catch (e) { return false; }
}
function setUnlocked(){
  try { localStorage.setItem(LS_UNLOCKED, '1'); } catch (e) {}
}
function clearLocalState(){
  try {
    localStorage.removeItem(LS_ANSWERS);
    localStorage.removeItem(LS_UNLOCKED);
  } catch (e) {}
}
function showPaywall(){
  paywallEl.classList.remove('hidden');
  requestAnimationFrame(() => paywallEl.classList.add('show'));
  setTimeout(() => {
    paywallEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 120);
}
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}
/* 发起支付：创建订单 → 注入支付宝表单 → 自动提交跳转收银台 */
payBtn.addEventListener('click', async () => {
  if (payBtn.disabled) return;
  payBtn.disabled = true;
  payStatusEl.textContent = '正在创建订单……';
  try {
    const resp = await fetch('/api/pay/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // returnUrl 按用户当前访问地址动态生成：电脑访问 localhost、手机访问局域网 IP 都能正确回跳
      body: JSON.stringify({ version: '1.0', returnUrl: window.location.origin + '/api/pay/return' })
    });
    const data = await resp.json();
    if (!data.success) throw new Error(data.message || '创建订单失败');
    const holder = document.createElement('div');
    holder.style.display = 'none';
    holder.innerHTML = data.payForm;
    document.body.appendChild(holder);
    const form = holder.querySelector('form');
    if (form) { form.submit(); }
    else { window.location.href = data.payForm; }
  } catch (err) {
    payStatusEl.textContent = '创建订单失败：' + err.message;
    payBtn.disabled = false;
  }
});
/* 支付回跳后轮询订单状态，确认已支付则解锁报告 */
let pollTimer = null;
function startStatusPolling(orderId){
  let tries = 0;
  clearInterval(pollTimer);
  payStatusEl.textContent = '正在确认支付结果……';
  pollTimer = setInterval(async () => {
    tries++;
    try {
      const resp = await fetch('/api/pay/status?orderId=' + encodeURIComponent(orderId));
      const data = await resp.json();
      if (data.success && data.status === 'PAID') {
        clearInterval(pollTimer);
        setUnlocked();
        paywallEl.classList.add('hidden');
        paywallEl.classList.remove('show');
        showResult();
      } else if (tries >= 30) {
        clearInterval(pollTimer);
        payStatusEl.textContent = '暂未确认到支付，请刷新页面后重试';
      }
    } catch (err) {
      if (tries >= 30) {
        clearInterval(pollTimer);
        payStatusEl.textContent = '查询失败，请刷新页面重试';
      }
    }
  }, 2000);
}
/* =========================================================
   十六、初始化
   ========================================================= */
loadSavedAnswers();
renderQuestion();
layoutCanvas();
drawRadar(0);
/* 支付回跳携带 orderId：轮询确认并解锁 */
const returnOrderId = getParam('orderId');
if (returnOrderId) startStatusPolling(returnOrderId);
/* 已解锁且答完：直接展示报告 */
if (isAllAnswered() && isUnlocked()) {
  showResult();
}
